<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Persona | Jes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="persona">
    <section class="persona-hero" aria-labelledby="persona-hero-title">
      <div class="persona-hero__content">
        <h1 id="persona-hero-title" class="persona-hero__title">Buenas, soy <strong>Jes!</strong></h1>
        <p class="persona-hero__intro">
          Acá vas a encontrar un poquito de las cosas que me gustan, las que me
          dan curiosidad y algunas otras que simplemente forman parte de mí.
        </p>
        <p class="persona-hero__note">
          <strong>Ah! Y sí, la muñequita soy yo.<br>
          Una versión de felpa, bastante más fotogénica que la original.</strong>
        </p>
      </div>

      <div class="persona-hero__media">
        <img
          src="View/jes-01.webp"
          alt="Muñequita de felpa saludando, con remera rayada y jean"
          width="413"
          height="486"
        >
      </div>
    </section>
  </main>
</body>
</html>
